<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#grad)"/>
  <!--
    Stylised "G" rendered as a single path so it renders identically
    everywhere (no font-resolution risk). Roughly: a c-shape with a
    horizontal bar tucked into the bottom-right opening — the classic
    geometric G silhouette.
  -->
  <path
    fill="white"
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
    d="
      M 256 96
      A 160 160 0 1 0 256 416
      Q 416 416 416 256
      L 416 232
      L 256 232
      L 256 296
      L 348 296
      Q 336 352 256 352
      A 96 96 0 1 1 256 160
      Q 320 160 348 200
      L 408 168
      Q 368 96 256 96
      Z
    "/>
</svg>

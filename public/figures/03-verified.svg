<?xml version="1.0" encoding="UTF-8"?>
<!--
  Image 3 — mirrors the Solnce demo's result view (`view = 'result'`,
  ok=true branch). Big green checkmark, "Verified — order complete"
  heading, the check-results panel listing each check key + ✓ pass,
  plus the two CTA buttons.

  Same nav as figures 1 and 2 to complete the triptych.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title">
  <title id="title">Step 3 — Verified, order complete</title>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="success-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Sticky nav (identical to figures 1 + 2) -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="80" y="14" width="28" height="28" rx="6" fill="url(#brand)"/>
  <text x="94" y="34" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-weight="800" font-size="14">S</text>
  <text x="120" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#111827">Solnce</text>
  <text x="194" y="35" font-family="Inter, sans-serif" font-size="13" fill="#64748b">· Identity-verified shopping</text>
  <text x="950" y="35" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Powered by</text>
  <text x="1024" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#111827" text-decoration="underline">Gramota</text>
  <text x="1100" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#111827">Docs →</text>

  <!-- Success glow halo -->
  <circle cx="600" cy="200" r="180" fill="url(#success-glow)"/>

  <!-- Big green checkmark circle -->
  <circle cx="600" cy="200" r="64" fill="#d1fae5"/>
  <path d="M 568 198 L 593 222 L 632 180" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="0.6s" fill="freeze"/>
  </path>

  <!-- Title -->
  <text x="600" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="32" fill="#0f172a">Verified — order complete</text>
  <text x="600" y="346" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#64748b">Your sunset festival vip pass is on its way. E-ticket delivered instantly.</text>

  <!-- Check results panel -->
  <g filter="url(#card-shadow)">
    <rect x="320" y="400" width="560" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="350" y="436" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.7">CHECK RESULTS</text>

    <!-- age_over_18: passed -->
    <text x="350" y="478" font-family="JetBrains Mono, monospace" font-size="13" fill="#0f172a">age_over_18</text>
    <text x="850" y="478" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#059669">✓ passed</text>
    <line x1="350" y1="496" x2="850" y2="496" stroke="#f1f5f9"/>

    <!-- residency_eu: passed -->
    <text x="350" y="528" font-family="JetBrains Mono, monospace" font-size="13" fill="#0f172a">residency_eu</text>
    <text x="850" y="528" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#059669">✓ passed</text>
    <line x1="350" y1="546" x2="850" y2="546" stroke="#f1f5f9"/>

    <!-- identity_verified: passed -->
    <text x="350" y="578" font-family="JetBrains Mono, monospace" font-size="13" fill="#0f172a">identity_verified</text>
    <text x="850" y="578" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#059669">✓ passed</text>
    <line x1="350" y1="596" x2="850" y2="596" stroke="#f1f5f9"/>

    <!-- claims peek -->
    <text x="350" y="624" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">CLAIMS DISCLOSED · given_name: Greta · birth_date: 1990-04-15 · nationality: BG</text>
  </g>

  <!-- CTA buttons -->
  <g>
    <rect x="490" y="690" width="220" height="48" rx="12" fill="url(#brand)"/>
    <text x="600" y="720" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="white">Back to store</text>
  </g>
</svg>

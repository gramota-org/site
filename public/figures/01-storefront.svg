<?xml version="1.0" encoding="UTF-8"?>
<!--
  Image 1 — mirrors the Solnce demo's storefront view (`view = 'store'`
  in App.tsx). Pixel-faithful enough that a screenshot of the live demo
  and this SVG read as the same UI: same nav, same hero gradient mesh,
  same product cards with gradient "photo" tiles + emoji + badges + prices.

  The middle product card carries a pulse animation to read as
  "click this to begin"; mirrors the verifying step the user sees next.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title">
  <title id="title">Step 1 — Solnce storefront, before checkout</title>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="prod-rakia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="prod-festival" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="prod-cbd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="hero-mesh-a" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-mesh-b" cx="70%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Sticky nav bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Brand -->
  <rect x="80" y="14" width="28" height="28" rx="6" fill="url(#brand)"/>
  <text x="94" y="34" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-weight="800" font-size="14">S</text>
  <text x="120" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#111827">Solnce</text>
  <text x="194" y="35" font-family="Inter, sans-serif" font-size="13" fill="#64748b">· Identity-verified shopping</text>

  <!-- Right-nav -->
  <text x="950" y="35" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Powered by</text>
  <text x="1024" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#111827" text-decoration="underline">Gramota</text>
  <text x="1100" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#111827">Docs →</text>

  <!-- Hero (with gradient mesh) -->
  <g>
    <rect x="80" y="80" width="1040" height="220" fill="white"/>
    <ellipse cx="430" cy="180" rx="360" ry="160" fill="url(#hero-mesh-a)"/>
    <ellipse cx="820" cy="220" rx="320" ry="150" fill="url(#hero-mesh-b)"/>
    <text x="600" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="2">LIVE DEMO · GRAMOTA SDK</text>
    <text x="600" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="36" fill="#0f172a">Identity-verified shopping</text>
    <text x="600" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="36" fill="url(#brand)">powered by your EU wallet.</text>
  </g>

  <!-- Category tabs -->
  <g font-family="Inter, sans-serif" font-weight="500" font-size="13">
    <rect x="80" y="330" width="55" height="32" rx="16" fill="#4f46e5"/>
    <text x="107" y="350" text-anchor="middle" fill="white">All</text>
    <rect x="143" y="330" width="76" height="32" rx="16" fill="#f8fafc"/>
    <text x="181" y="350" text-anchor="middle" fill="#64748b">Drinks</text>
    <rect x="227" y="330" width="92" height="32" rx="16" fill="#f8fafc"/>
    <text x="273" y="350" text-anchor="middle" fill="#64748b">Wellness</text>
    <rect x="327" y="330" width="76" height="32" rx="16" fill="#f8fafc"/>
    <text x="365" y="350" text-anchor="middle" fill="#64748b">Tickets</text>
    <rect x="411" y="330" width="76" height="32" rx="16" fill="#f8fafc"/>
    <text x="449" y="350" text-anchor="middle" fill="#64748b">Gaming</text>
    <rect x="495" y="330" width="76" height="32" rx="16" fill="#f8fafc"/>
    <text x="533" y="350" text-anchor="middle" fill="#64748b">Finance</text>
  </g>

  <!-- Product grid: 3 cards -->
  <!-- Card 1: Sliven Aged Rakia -->
  <g filter="url(#card-shadow)">
    <rect x="80" y="395" width="320" height="350" rx="16" fill="white" stroke="#e2e8f0"/>
    <rect x="80" y="395" width="320" height="170" rx="16" fill="url(#prod-rakia)"/>
    <text x="240" y="500" text-anchor="middle" font-size="80">🥃</text>
    <rect x="346" y="411" width="42" height="24" rx="12" fill="white" fill-opacity="0.95"/>
    <text x="367" y="427" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#0f172a">18+</text>
    <text x="100" y="600" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.7">STARA PLANINA CELLARS</text>
    <text x="100" y="624" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#111827">Sliven Aged Rakia</text>
    <text x="100" y="648" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Single-distillation grape rakia</text>
    <text x="100" y="666" font-family="Inter, sans-serif" font-size="13" fill="#64748b">from a small Bulgarian estate.</text>
    <line x1="100" y1="688" x2="380" y2="688" stroke="#f1f5f9"/>
    <text x="100" y="722" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="#111827">€38</text>
    <text x="380" y="722" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Ships in 2 days</text>
  </g>

  <!-- Card 2: Sunset Festival (highlighted with pulse) -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="385" width="320" height="360" rx="16" fill="white" stroke="#4f46e5" stroke-width="2"/>
    <rect x="440" y="385" width="320" height="170" rx="16" fill="url(#prod-festival)"/>
    <text x="600" y="490" text-anchor="middle" font-size="80">🎶</text>
    <rect x="694" y="401" width="62" height="24" rx="12" fill="white" fill-opacity="0.95"/>
    <text x="725" y="417" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#0f172a">18+ · ID</text>
    <text x="460" y="590" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.7">AURORA LIVE</text>
    <text x="460" y="614" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#4f46e5">Sunset Festival VIP Pass</text>
    <text x="460" y="638" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Front-row access, backstage</text>
    <text x="460" y="656" font-family="Inter, sans-serif" font-size="13" fill="#64748b">lounge. Belgrade, Aug 22-24.</text>
    <line x1="460" y1="678" x2="740" y2="678" stroke="#f1f5f9"/>
    <text x="460" y="712" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="#111827">€119</text>
    <text x="740" y="712" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#64748b">E-ticket instant</text>

    <!-- Cursor pulse -->
    <circle cx="600" cy="730" r="9" fill="#4f46e5"/>
    <circle cx="600" cy="730" r="20" fill="#4f46e5" fill-opacity="0.25">
      <animate attributeName="r" values="20;36;20" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.25;0;0.25" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 3: CBD Wellness -->
  <g filter="url(#card-shadow)">
    <rect x="800" y="395" width="320" height="350" rx="16" fill="white" stroke="#e2e8f0"/>
    <rect x="800" y="395" width="320" height="170" rx="16" fill="url(#prod-cbd)"/>
    <text x="960" y="500" text-anchor="middle" font-size="80">🌿</text>
    <rect x="1051" y="411" width="68" height="24" rx="12" fill="white" fill-opacity="0.95"/>
    <text x="1085" y="427" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#0f172a">18+ · EU</text>
    <text x="820" y="600" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.7">GREENFIELD APOTHECARY</text>
    <text x="820" y="624" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#111827">CBD Wellness Tincture</text>
    <text x="820" y="648" font-family="Inter, sans-serif" font-size="13" fill="#64748b">EU-compliant broad-spectrum</text>
    <text x="820" y="666" font-family="Inter, sans-serif" font-size="13" fill="#64748b">CBD oil. Lab-tested, vegan.</text>
    <line x1="820" y1="688" x2="1100" y2="688" stroke="#f1f5f9"/>
    <text x="820" y="722" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="#111827">€42</text>
    <text x="1100" y="722" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Ships in 1-3 days</text>
  </g>
</svg>
